# The Android packaging tool (AAPT2) ships as x86_64 host binary only.
# Override it with a QEMU-wrapped copy so builds work on ARM64 hosts.
# Target output is still native (arm64-v8a); no target code is emulated.
android.aapt2FromMavenOverride=/var/minis/workspace/android-tools/bin/aapt2
org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
